
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-book-catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-book-catalog
  template:
    metadata:
      labels:
        app: online-book-catalog
    spec:
      containers:
        - name: online-book-catalog
          image: online-book-catalog:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: online-book-catalog
spec:
  type: ClusterIP
  selector:
    app: online-book-catalog
  ports:
    - port: 5000
      targetPort: 5000
